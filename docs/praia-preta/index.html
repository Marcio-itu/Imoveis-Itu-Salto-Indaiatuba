<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imóveis em Praia Preta — Inteligência Imobiliária. Construindo Confiança.</title>
<meta name="description" content="Imóveis à venda em Praia Preta.">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background-color:#FAF8F4;
    background-image:
      radial-gradient(circle at 12% -10%, rgba(47,93,124,.08) 0%, transparent 45%),
      radial-gradient(circle at 88% 0%, rgba(176,141,87,.10) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(31,138,95,.06) 0%, transparent 50%);
    background-attachment:fixed;
    color:#1E2A28;font-family:'Inter', -apple-system, Helvetica, Arial, sans-serif;line-height:1.55;min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:56px 24px 80px}
  h1{font-family:'Fraunces', Georgia, serif;font-weight:500;font-size:clamp(28px,5vw,40px);margin-bottom:8px}
  p.sub{color:#5B6A67;margin-bottom:32px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#2F5D7C;font-weight:600}
  a{color:inherit}

  .filtros{background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1px solid #DCE3E1;
    border-radius:14px;padding:18px 20px;margin:28px 0 36px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{border:1px solid #DCE3E1;background:#fff;padding:8px 16px;border-radius:999px;font-size:13px;
    cursor:pointer;transition:.15s}
  .chip.on{background:#2F5D7C;border-color:#2F5D7C;color:#fff}
  .filtros-linha{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .filtros-linha select,.filtros-linha input{border:1px solid #DCE3E1;border-radius:8px;padding:9px 12px;
    font-size:14px;font-family:inherit;background:#fff}
  .filtros-linha label{font-size:12px;color:#5B6A67;display:block;margin-bottom:4px}
  .campo{display:flex;flex-direction:column}
  .campo input{width:120px}
  .limpar{background:none;border:none;color:#2F5D7C;font-size:13px;cursor:pointer;text-decoration:underline;
    margin-left:auto;align-self:flex-end}
  .contagem{font-size:13px;color:#5B6A67;margin-bottom:16px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  a.card{display:block;background:#fff;border:1px solid #DCE3E1;border-radius:14px;overflow:hidden;
    text-decoration:none;color:#1E2A28;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.10)}
  a.card .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#F4F6F5}
  a.card .body{padding:14px 16px}
  a.card .tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;color:#fff;margin-bottom:8px}
  a.card .tit{font-family:'Fraunces', Georgia, serif;font-size:17px;line-height:1.25}
  a.card .meta{font-size:13px;color:#5B6A67;margin-top:4px}
  a.card .preco{font-family:'Fraunces', Georgia, serif;font-size:15px;margin-top:8px}

  a.item{display:block;background:#fff;border:1px solid #DCE3E1;border-radius:8px;
    padding:18px 22px;margin-bottom:12px;text-decoration:none;color:#1E2A28;transition:border-color .2s;
    box-shadow:0 2px 10px rgba(0,0,0,.05)}
  a.item:hover{border-color:#2F5D7C}
  a.item .tit{font-family:'Fraunces', Georgia, serif;font-size:19px}
  a.item .meta{font-size:13px;color:#5B6A67;margin-top:4px}

  .vazio{padding:40px 20px;text-align:center;color:#5B6A67;background:rgba(255,255,255,.6);
    border-radius:14px;border:1px dashed #DCE3E1}
  footer{margin-top:56px;font-size:13px;color:#5B6A67}
  </style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow"><a href="https://marcio-itu.github.io/Imoveis-Itu-Salto-Indaiatuba/" style="color:inherit">← Todas as cidades</a></span>
  <h1>Praia Preta</h1>
  <p class="sub">1 imóvel disponível</p>
  <div class="grid">
    <a class="card" href="../imoveis/casa-praia-preta/">
        <img class="thumb" src="https://marcio-itu.github.io/Imoveis-Itu-Salto-Indaiatuba/imoveis/casa-praia-preta/fotos/fachada-casa-alto-padrao-sao-sebastiao-sp-vista-mar-20260728.jpg" loading="lazy" alt="Casa em Praia Preta">
        <div class="body">
          <span class="tag" style="background:#B08D57">Alto padrão</span>
          <div class="tit">Casa em Praia Preta</div>
          <div class="meta">R$ 2.450.000</div>
        </div>
      </a>
  </div>
</div>
</body>
</html>
