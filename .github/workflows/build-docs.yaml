name: Gerar páginas dos imóveis

on:
  push:
    branches: [main]
    paths:
      - 'imoveis/**'
      - 'scripts/**'
      - 'config.json'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

# Sem isso, 2 saves próximos no admin (salvar → fechar → reabrir → editar → salvar de
# novo, o fluxo normal) disparavam 2 builds em paralelo, cada um gerando docs/ a partir
# da mesma base e disputando o commit final — o perdedor da corrida podia nunca ir pro
# ar, sem erro visível (causa raiz de "editei mas não mudou no site"). cancel-in-progress
# false = a 2ª edição espera a 1ª terminar e builda em cima do resultado dela, em vez de
# rodar ao mesmo tempo. Nenhuma edição é descartada, só processada em fila.
concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.detectar.outputs.slugs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          echo "ffmpeg OK"

      - name: Detectar imóvel alterado
        id: detectar
        run: |
          SLUGS=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD -- imoveis/ | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          if [ -z "$SLUGS" ]; then
            SLUGS=$(git diff --name-only --diff-filter=AMR HEAD~1 -- imoveis/ 2>/dev/null | cut -d'/' -f2 | sort -u | tr '\n' ' ' || true)
          fi
          echo "Imóveis alterados: $SLUGS"
          echo "slugs=$SLUGS" >> $GITHUB_OUTPUT

      - name: Gerar /docs só do que mudou
        run: |
          if [ -n "${{ steps.detectar.outputs.slugs }}" ]; then
            node scripts/build.js --only=${{ steps.detectar.outputs.slugs }}
          else
            node scripts/build.js
          fi

      - name: Commitar /docs se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nada pra commitar"
          else
            git commit -m "chore: atualiza docs - ${{ steps.detectar.outputs.slugs }}"
            # "|| true" aqui era o que deixava um conflito de rebase passar em silêncio
            # e possivelmente subir docs/ incompleto sem job nenhum falhar. Agora, se
            # rebase falhar de verdade (não deve mais acontecer com a fila do
            # concurrency acima, mas por segurança), o job falha visivelmente em vez
            # de publicar estado quebrado sem avisar.
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase falhou — abortando rebase pra não publicar docs/ incompleto. Rode o build de novo (workflow_dispatch) depois de conferir o main."
              git rebase --abort || true
              exit 1
            fi
            git push
          fi

  publish-instagram:
    needs: build
    if: ${{ needs.build.outputs.slugs!= '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Publicar no Instagram / Facebook / Catálogo
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          CATALOG_ID: ${{ secrets.CATALOG_ID }}
          IMOVEL_SLUG: ${{ needs.build.outputs.slugs }}
        run: node scripts/publish-social.js
