name: Gerar páginas dos imóveis

on:
  push:
    branches: [main]
    paths:
      - "imoveis/**"
      - "scripts/**"
      - "config.json"
      - "package.json"
      - "assets/**"
  workflow_dispatch: {}

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar ffmpeg (pra gerar o vídeo reel de cada imóvel)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Detectar imóvel alterado (pra publicar depois nas redes)
        id: slug
        run: |
          SLUG=$(git diff --name-only HEAD~1 HEAD -- imoveis/ 2>/dev/null | awk -F/ '{print $2}' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          echo "Imóveis alterados: $SLUG"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Gerar /docs
        run: node scripts/build.js

      - name: Commitar /docs se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "build: atualiza páginas geradas [automático]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push rejeitado, tentando novamente ($i/5)..."
            sleep $((i * 4))
          done
          echo "Não consegui publicar /docs após várias tentativas, mas não vou quebrar o workflow"
          exit 0

  publish-instagram:
    needs: build
    if: needs.build.outputs.slug != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Publicar no Instagram / Facebook / Catálogo
        run: node scripts/publish-social.js
        env:
          IMOVEL_SLUG: ${{ needs.build.outputs.slug }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          CATALOG_ID: ${{ secrets.CATALOG_ID }}
