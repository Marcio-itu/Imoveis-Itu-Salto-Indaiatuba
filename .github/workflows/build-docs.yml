name: Gerar páginas dos imóveis

on:
  push:
    branches: [main]
    paths:
      - 'imoveis/**'
      - 'scripts/**'
      - 'config.json'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.detectar.outputs.slugs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Verificar ffmpeg (já vem no runner)
        # Sem o "-o pipefail", "ffmpeg -version | head -1" reporta sucesso mesmo se o
        # ffmpeg não existir (o status de saída vira o do "head", não o do "ffmpeg").
        # Com pipefail, se o ffmpeg realmente sumir do runner, esse step falha de verdade
        # e aparece vermelho no Actions — em vez de mentir "ffmpeg OK" e deixar os vídeos
        # pararem de ser gerados silenciosamente (só um aviso enterrado no log do build).
        run: |
          set -o pipefail
          ffmpeg -version | head -1
          echo "ffmpeg OK"

      - name: Detectar imóvel alterado
        id: detectar
        run: |
          SLUGS=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD -- imoveis/ | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          if [ -z "$SLUGS" ]; then
            SLUGS=$(git diff --name-only --diff-filter=AMR HEAD~1 -- imoveis/ 2>/dev/null | cut -d'/' -f2 | sort -u | tr '\n' ' ' || true)
          fi
          echo "Imóveis alterados: $SLUGS"
          echo "slugs=$SLUGS" >> $GITHUB_OUTPUT

      - name: Gerar /docs só do que mudou
        run: |
          if [ -n "${{ steps.detectar.outputs.slugs }}" ]; then
            node scripts/build.js --only=${{ steps.detectar.outputs.slugs }}
          else
            node scripts/build.js
          fi

      - name: Commitar /docs se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nada pra commitar"
          else
            git commit -m "chore: atualiza docs - ${{ steps.detectar.outputs.slugs }}"
            git pull --rebase origin main || true
            git push
          fi

  publish-instagram:
    needs: build
    if: ${{ needs.build.outputs.slugs!= '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Publicar no Instagram / Facebook / Catálogo
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          CATALOG_ID: ${{ secrets.CATALOG_ID }}
          IMOVEL_SLUG: ${{ needs.build.outputs.slugs }}
        run: node scripts/publish-social.js
