name: Gerar páginas dos imóveis

on:
  push:
    branches: [main]
    paths:
      - "imoveis/**"
      - "scripts/**"
      - "config.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar /docs
        run: node scripts/build.js

      - name: Commitar /docs se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet || git commit -m "build: atualiza páginas geradas [automático]"
          git push
